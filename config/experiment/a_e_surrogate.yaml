name: surrogate_validation_ae_likert_multiseed
split_id: three_way_plus_holdout_v1
# Seeds to run. run_pipeline.py runs the full matrix once per seed (each value
# replaces the global seed for that run). Use a one-element list for a single
# run. Can also be passed on the CLI: `experiment.seeds=[42,43,44]`.
# seeds: [10, 20, 30, 42]
seeds: [42]
runs_subdir: a_e_surrogate_multiseed

models:
  - gemma-3-4b
  - qwen-3-8b
  # - llama-3.1-8b
  # - phi-3

directions:
  - minimize
  - maximize

feature_counts:
  - 96

trial_grid:
  "96": [2000]

scopes:
  - prompt_all

intervention_last_k: 3

stages:
  extract_activations: false
  feature_selection: false
  optimization: true
  ipi_baseline: true
  ipi_intervened: true
  poeta: false
